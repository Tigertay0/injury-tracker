# Checks every pull request, and deploys the Worker to Cloudflare on every push to main.
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public build-time values (repository variables, not secrets)
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two deploys at once; a newer push waits for the current one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://pitchsafe.us
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds with the cloudflare vite plugin, then wrangler deploys the generated config
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live site and database
        run: |
          sleep 5
          curl -fsS "https://pitchsafe.us/api/health?db=1" | grep -q '"database":true'
